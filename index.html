<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="apps.css">
<link rel="stylesheet" href="tabbar.css">
<link rel="stylesheet" href="edit-drag.css">
</head>
<body>

<div class="app-shell">
  <div class="page-container">

    <div class="page active" data-page="home">
      
      <!-- 个人卡片 -->
      <div class="profile-card draggable" id="profileCard" data-component="card">
        <button class="edit-btn" data-edit-target="card">编辑</button>
        
        <div class="card-bg" id="cardBg"></div>
        <div class="card-upper" id="cardUpper"></div>
        <div class="card-lower" id="cardLower">
          <div class="lower-overlay" id="lowerOverlay"></div>
          
          <div class="avatar-wrapper" id="avatarBtn">
            <img id="avatarImg" alt="头像">
            <svg class="avatar-placeholder" viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </div>

          <div class="info-area">
            <div class="info-text line-1" contenteditable="true" data-key="line1" data-placeholder="姓名"></div>
            <div class="info-text line-2" contenteditable="true" data-key="line2" data-placeholder="身份/称号"></div>
            <div class="info-text line-3" contenteditable="true" data-key="line3" data-placeholder="签名/心情"></div>
            <div class="info-text line-4" data-key="line4" data-placeholder="所在地">
              <svg class="location-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="location-text" contenteditable="true" data-key="line4text"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- 消息卡片 -->
      <div class="message-card draggable" id="messageCard" data-component="message">
        <button class="edit-btn" data-edit-target="message">编辑</button>
        
        <div class="message-avatar">
          <img alt="角色头像">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </div>
        <div class="message-content">
          <div class="message-preview">暂无消息</div>
        </div>
        <div class="message-badge">
          <svg class="badge-icon" viewBox="0 0 20 22">
            <path d="M4 2 L16 2 Q18 2 18 4 L18 12 Q18 14 16 14 L11 14 L10 17 L9 14 L4 14 Q2 14 2 12 L2 4 Q2 2 4 2 Z" 
                  stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="8" r="1" fill="currentColor"/>
            <circle cx="10" cy="8" r="1" fill="currentColor"/>
            <circle cx="14" cy="8" r="1" fill="currentColor"/>
          </svg>
          <span>最新讯息</span>
        </div>
      </div>

      <!-- 功能图标（每个都可拖拽） -->
      <div class="app-grid" id="appGrid">
        <div class="app-icon draggable" data-action="plot" data-component="icon-plot">
          <button class="edit-btn icon-edit-btn" data-edit-target="icon">编辑</button>
          <div class="icon-box">
            <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M8 6V4"/><path d="M16 6V4"/><path d="M12 6V3"/></svg>
          </div>
          <div class="icon-label">剧情</div>
        </div>
        <div class="app-icon draggable" data-action="message" data-component="icon-message">
          <button class="edit-btn icon-edit-btn" data-edit-target="icon">编辑</button>
          <div class="icon-box">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="icon-label">传讯</div>
        </div>
        <div class="app-icon draggable" data-action="explore" data-component="icon-explore">
          <button class="edit-btn icon-edit-btn" data-edit-target="icon">编辑</button>
          <div class="icon-box">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/></svg>
          </div>
          <div class="icon-label">万象</div>
        </div>
        <div class="app-icon draggable" data-action="vault" data-component="icon-vault">
          <button class="edit-btn icon-edit-btn" data-edit-target="icon">编辑</button>
          <div class="icon-box">
            <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18"/><circle cx="12" cy="14" r="1.5"/><path d="M7 8V6a5 5 0 0 1 10 0v2"/></svg>
          </div>
          <div class="icon-label">宝阁</div>
        </div>
      </div>
    </div>

    <div class="page" data-page="plot"><div class="page-title">剧情</div><div class="placeholder-card">剧情模块开发中</div></div>
    <div class="page" data-page="message"><div class="page-title">传讯</div><div class="placeholder-card">对话模块开发中</div></div>
    <div class="page" data-page="explore"><div class="page-title">万象</div><div class="placeholder-card">万象模块开发中</div></div>
    <div class="page" data-page="vault"><div class="page-title">宝阁</div><div class="placeholder-card">宝阁模块开发中</div></div>
    <div class="page" data-page="mask"><div class="page-title">面具</div><div class="placeholder-card">面具模块开发中</div></div>
    <div class="page" data-page="character"><div class="page-title">角色</div><div class="placeholder-card">角色模块开发中</div></div>
    <div class="page" data-page="settings"><div class="page-title">设置</div><div class="placeholder-card">设置模块开发中</div></div>
    <div class="page" data-page="life"><div class="page-title">浮生</div><div class="placeholder-card">浮生模块开发中</div></div>
  </div>

  <!-- 卡片编辑弹窗 -->
  <div class="edit-popup" id="cardEditPopup">
    <div class="popup-title">卡片设置</div>
    
    <div class="control-group">
      <button class="action-btn" id="uploadBgBtn">更换背景</button>
      <button class="action-btn danger" id="deleteBgBtn">删除背景</button>
    </div>
    
    <div class="control-group">
      <button class="action-btn" id="uploadAvatarBtn">更换头像</button>
      <button class="action-btn danger" id="deleteAvatarBtn">删除头像</button>
    </div>
    
    <div class="control-row">
      <span class="control-label">毛玻璃</span>
      <div class="toggle-switch">
        <input type="checkbox" id="cardGlassToggle">
        <label for="cardGlassToggle"></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">遮罩颜色</span>
      <input type="color" id="cardColorPicker" value="#ffffff">
    </div>
    <div class="control-row">
      <span class="control-label">透明度</span>
      <input type="range" id="cardOpacitySlider" min="0" max="100" value="80">
      <span class="value-display" id="cardOpacityValue">80%</span>
    </div>
    <button class="popup-done-btn" id="cardDoneBtn">完成</button>
  </div>

  <!-- 底部栏编辑弹窗 -->
  <div class="edit-popup" id="tabbarEditPopup">
    <div class="popup-title">底部栏设置</div>
    
    <div class="control-row">
      <span class="control-label">毛玻璃</span>
      <div class="toggle-switch">
        <input type="checkbox" id="tabbarGlassToggle" checked>
        <label for="tabbarGlassToggle"></label>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">背景颜色</span>
      <input type="color" id="tabbarBgColor" value="#ffffff">
    </div>
    <div class="control-row">
      <span class="control-label">透明度</span>
      <input type="range" id="tabbarOpacitySlider" min="0" max="100" value="92">
      <span class="value-display" id="tabbarOpacityValue">92%</span>
    </div>
    <div class="control-row">
      <span class="control-label">边框颜色</span>
      <input type="color" id="tabbarBorderColor" value="#3c3c43">
    </div>
    <div class="control-row">
      <span class="control-label">边框粗细</span>
      <input type="range" id="tabbarBorderWidth" min="0" max="5" step="0.5" value="0.5">
      <span class="value-display" id="tabbarBorderValue">0.5px</span>
    </div>
    <button class="popup-done-btn" id="tabbarDoneBtn">完成</button>
  </div>

  <div class="edit-overlay" id="editOverlay"></div>

  <!-- 底部栏 -->
  <div class="tab-bar" id="tabBar">
    <button class="edit-btn tabbar-edit-btn" data-edit-target="tabbar">编辑</button>
    
    <div class="tab-bar-capsule">
      <div class="tab-item active" data-tab="home">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </div>
        <div class="tab-label">面具</div>
      </div>
      <div class="tab-item" data-tab="character">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a6.5 6.5 0 0 1 13 0"/></svg>
        </div>
        <div class="tab-label">角色</div>
      </div>
      <div class="tab-item" data-tab="settings">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1.08 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1.08z"/></svg>
        </div>
        <div class="tab-label">设置</div>
      </div>
      <div class="tab-item" data-tab="life">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24"><path d="M6 21c0 0 1-4 6-9s9-6 9-6-1 4-6 9-9 6-9 6z"/><path d="M6 21c0-3 2-6 5-8"/></svg>
        </div>
        <div class="tab-label">浮生</div>
      </div>
    </div>
  </div>
</div>

<!-- 裁剪弹窗 -->
<div class="crop-modal" id="cropModal">
  <div class="crop-container">
    <div class="crop-header">
      <button class="crop-cancel" id="cropCancel">取消</button>
      <span>裁剪照片</span>
      <button class="crop-confirm" id="cropConfirm">完成</button>
    </div>
    <div class="crop-area">
      <img id="cropImage" alt="待裁剪图片">
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script src="app.js"></script>
<script src="components.js"></script>
<script src="edit-drag.js"></script>
<script src="tabbar.js"></script>
</body>
</html>
